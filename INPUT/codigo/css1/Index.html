<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado 2 — Grid Básico (para completar en clase)</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
body.dark-mode {
  background-color: #333;
}
   
    .grid-container {
      
      display: grid ;
      
      grid-template-columns: 100px 2fr 1fr;
      
       gap:10px;
      
      @media (min-width: 500px) {
      .grid-item {
        background-color: rgb(243, 166, 166); 
        }
       }
      
       @media (min-width: 700px) {
      .grid-item {
        border-radius: 50px;
        background-color: rgb(211, 89, 89); 
        }
       }
       @media (min-width: 700px) {
      .grid-item2 {
        border-radius: 50px;
        background-color: rgb(77, 59, 59); 
        }
       }

     
      background-color: #dfbc89;
      padding: 15px;
      border-radius: 8px;
    }

    .grid-item {
      background-color: #e49d4b;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }
    .grid-item2 {
      background-color: #58180d;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }
    .grid-item-3 {
      background-color: #e05050e3;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }

  </style>
</head>
<body>
  <h1 id="titulo">Mi Primer Grid</h1>
  <p id= "descripcion"style="margin: 20px 0;">Grid con 3 columnas de 200px cada una — completa los TODO del CSS.</p>

  <div class="grid-container">
    <div class="grid-item">1</div>
    <div class="grid-item">2</div>
    <div class="grid-item">3</div>
    <div class="grid-item">4</div>
    <div id="item8" class="grid-item">8</div>
    <div id="demo" class="grid-item">9</div>
  </div>

  <button id="boton">Botón</button>
  <button id="boton2">Botón</button>

   <div id="caja1" class="grid-container-1">
    <div class="grid-item">A</div>
    <div class="grid-item">B</div>
    <div class="grid-item">C</div>
  </div>

  <div id="caja2" class="grid-container-2">
    <div class="grid-item-1">D</div>
    <div class="grid-item-2">E</div>
    <div class="grid-item-3">F</div>
  </div>
<div id="caja3" class="grid-container-3">
    <div class="grid-item-1">D</div>
    <div class="grid-item-2">E</div>
    <div class="grid-item-3">F</div>
  </div>
  <div id="caja4" class="grid-container-4">
    <div class="grid-item-1">D</div>
    <div class="grid-item-2">E</div>
    <div class="grid-item-3">F</div>
  </div>

  

  <script>
btn

const titulo = document.getElementById("titulo");
const descripcion = document.getElementById("descripcion");

function toggleCaja3() {
  let caja3 = document.getElementById("caja3");
  if (window.innerWidth >= 700) {
    caja3.style.display = "none";
  } else {
    caja3.style.display = "";
  }
}
toggleCaja3();
window.addEventListener("resize", toggleCaja3);

let demoDiv = document.getElementById("demo");
let btnMsg = document.getElementById("boton");
btnMsg.addEventListener("click", function () {
  demoDiv.textContent = "holis";
});

let btnMsgg = document.getElementById("boton2");
btnMsgg.addEventListener("click", function () {
  document.body.classList.toggle("dark-mode");
  if (document.body.classList.contains("dark-mode")) {
    btnMsgg.textContent = "Modo Claro";
  } else {
    btnMsgg.textContent = "Modo Oscuro";
  }

});
function resize () {
  if (window.innerWidth >= 1024) { 
    titulo.textContent = "Modo Desktop";
    descripcion.textContent = "Grid con 3 columnas de 200px cada una — completa los TODO del CSS.";
  }
  else if (window.innerWidth >=768)
  {
    titulo.textContent = "Modo Tablet";
    descripcion.textContent = "Grid con 3 columnas de 200px cada una — completa los TODO del CSS.";
  }
  else {
    titulo.textContent = "Modo Teléfono";
    descripcion.textContent = "Grid con 3 columnas de 200px cada una — completa los TODO del CSS.";
  }
}

window.addEventListener("resize", resize);

resize(); // Llamar a la función al cargar la página para aplicar el estilo inicial



  </script>
</body>
</html>

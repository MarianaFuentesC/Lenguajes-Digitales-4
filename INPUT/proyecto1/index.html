<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destinos — Galería</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="dark-mode-toggle">Modo oscuro</button>

  <header class="header">
    <h1>Destinos Turísticos</h1>
  </header>

  <section class="filtros">
    <div class="filtro-idioma">
      <label for="filtro-idioma">Idioma</label>
      <select id="filtro-idioma">
        <option value="todos">Todos</option>
      </select>
    </div>

    <div class="filtro-continentes" id="filtro-continentes"></div>
  </section>

  <div class="galeria-layout">
    <aside class="filtro-calificacion">
      <label for="filtro-calificacion">Calificación mínima</label>
      <input type="range" id="filtro-calificacion" step="1">
      <output id="valor-calificacion" for="filtro-calificacion"></output>
    </aside>

    <section class="galeria" id="galeria"></section>
  </div>

  <script src="data.js"></script>
  <script src="storage.js"></script>
  <script src="index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda — Galería de productos</title>

  <!-- Mismas fuentes que admins.html: Inter (texto) y Plus Jakarta Sans (títulos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/galeria.css">

  <!-- theme.js en el <head>: aplica día/noche antes de pintar (sin parpadeo).
       Es el mismo de admins.html y cliente.html: la elección se comparte. -->
  <script src="js/theme.js"></script>
</head>
<body>

  <!-- ================= INTERRUPTOR DÍA / NOCHE ================= -->
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema">
    <span class="tt-cielo" aria-hidden="true"></span>
    <span class="tt-perilla" aria-hidden="true">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.5" fill="currentColor" />
        <path d="M12 1.5v2M12 20.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M1.5 12h2M20.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4" />
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
    </span>
  </button>

  <!-- ================= HEADER (fijo arriba) ================= -->
  <header class="topbar">
    <a class="brand" href="galeria.html">🛍️ Mi Tienda</a>

    <!-- Buscador: filtra mientras escribes (evento "input" en galeria.js) -->
    <label class="buscador">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
      </svg>
      <span class="sr-only">Buscar productos</span>
      <input type="search" id="input-buscar" placeholder="Buscar productos, categorías…" autocomplete="off">
    </label>

    <nav class="topbar-acciones">
      <!-- Favoritos: al hacer clic muestra SOLO los favoritos (es un filtro) -->
      <button type="button" class="icon-btn" id="btn-favoritos" data-accion="ver-favoritos" aria-pressed="false" aria-label="Ver solo favoritos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.3C1.1 8.3 3.3 5 6.8 5c2 0 3.4 1.1 4.2 2.4h2C13.8 6.1 15.2 5 17.2 5c3.5 0 5.7 3.3 4.3 6.7C19.5 16.4 12 21 12 21z"/></svg>
        <span class="contador" id="contador-favoritos">0</span>
      </button>

      <a class="icon-btn" href="cliente.html" aria-label="Mi cuenta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4" /><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" />
        </svg>
      </a>

      <!-- Carrito: abre el panel lateral -->
      <button type="button" class="btn-carrito" data-accion="abrir-carrito" aria-label="Abrir carrito">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6" /><circle cx="10" cy="20.5" r="1.3" /><circle cx="17" cy="20.5" r="1.3" />
        </svg>
        <span class="btn-carrito-texto">Carrito</span>
        <span class="contador" id="contador-carrito">0</span>
      </button>
    </nav>
  </header>

  <!-- ================= HERO ================= -->
  <section class="hero">
    <div class="hero-contenido">
      <p class="hero-etiqueta">✨ Nueva temporada</p>
      <h1>Descubre lo que<br><span>te encanta</span></h1>
      <p class="hero-texto">Tecnología, ropa, hogar y más. Descuentos de hasta <strong>25%</strong> y envío gratis en compras desde <strong id="hero-envio">$200.000</strong>.</p>
      <a href="#catalogo" class="btn btn-primary btn-lg">Ver productos ↓</a>
    </div>
    <!-- Collage decorativo: galeria.js lo llena con imágenes de productos -->
    <div class="hero-collage" id="hero-collage" aria-hidden="true"></div>
  </section>

  <!-- ================= CATÁLOGO ================= -->
  <main id="catalogo" class="catalogo">

    <!-- Barra de herramientas: categorías + orden -->
    <div class="toolbar">
      <!-- Los chips de categoría los crea galeria.js a partir de los datos -->
      <div class="chips-filtro" id="chips-categorias" role="toolbar" aria-label="Filtrar por categoría"></div>

      <label class="orden">
        <span>Ordenar</span>
        <select id="select-orden">
          <option value="relevancia">Destacados</option>
          <option value="precio-asc">Precio: menor a mayor</option>
          <option value="precio-desc">Precio: mayor a menor</option>
          <option value="descuento">Mayor descuento</option>
          <option value="nombre">Nombre A–Z</option>
        </select>
      </label>
    </div>

    <p class="resultados" id="texto-resultados" role="status"></p>

    <!-- La galería se construye con JavaScript. Mientras "llegan" los
         datos se ven tarjetas esqueleto (gris animado). -->
    <div id="galeria" class="galeria" aria-live="polite"></div>
  </main>

  <footer class="footer">
    <p>🛍️ Mi Tienda · Proyecto Lenguajes Digitales · Datos de demostración</p>
  </footer>

  <!-- ================= VISTA RÁPIDA (modal) =================
       <dialog> es un elemento nativo de HTML para ventanas modales:
       se abre con showModal() y se cierra con Esc sin escribir código extra. -->
  <dialog id="vista-rapida" class="vista">
    <div id="vista-contenido"></div>
  </dialog>

  <!-- ================= CARRITO (panel lateral) ================= -->
  <div id="overlay" class="overlay" data-accion="cerrar-carrito"></div>

  <aside id="panel-carrito" class="carrito" aria-label="Carrito de compras" aria-hidden="true">
    <div class="carrito-header">
      <h2>Tu carrito <span id="carrito-cantidad-titulo"></span></h2>
      <button type="button" class="icon-btn" data-accion="cerrar-carrito" aria-label="Cerrar carrito">✕</button>
    </div>

    <!-- Barra de envío gratis: muestra cuánto falta -->
    <div class="envio" id="envio-gratis"></div>

    <div class="carrito-lista" id="lista-carrito"></div>

    <div class="carrito-footer" id="carrito-footer"></div>
  </aside>

  <!-- Avisos flotantes ("Agregado al carrito", etc.) -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- productos-demo.js crea el array productosDemo; galeria.js lo usa,
       por eso se carga primero -->
  <script src="js/productos-demo.js"></script>
  <script src="js/galeria.js"></script>
</body>
</html>

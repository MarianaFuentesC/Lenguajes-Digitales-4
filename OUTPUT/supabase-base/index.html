<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase — Base CRUD</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <form id="search-form" class="search">
      <label for="input-search">Buscar por categoría, Id</label>
      <div class="search-row">
        <input type="search" id="input-search" placeholder="Ej: Ropa o 12">
        <button type="submit" id="btn-search">Buscar</button>
      </div>
    </form>
  </header>

  <main class="container">
    <p id="message" class="message" role="status" hidden></p>

    <section class="card">
      <h1 id="form-title" class="center">Crear producto</h1>
      <form id="project-form">
        <label>
          Nombre
          <input type="text" id="input-name" required>
        </label>
        <label>
          Descripción
          <textarea id="input-description" rows="3"></textarea>
        </label>
        <label>
          Precio
          <input type="number" id="input-price" min="0" step="0.01" required>
        </label>
        <label>
          Unidades
          <input type="number" id="input-units" min="0" step="1" required>
        </label>
        <label>
          Descuento (0 a 1, ej: 0.1 = 10%)
          <input type="number" id="input-discount" min="0" max="1" step="0.01" value="0">
        </label>
        <label>
          Categorías
          <input type="text" id="input-category" placeholder="Ropa, Hombre…" required>
        </label>
        <label>
          URL de la imagen
          <input type="url" id="input-image" placeholder="https://...">
        </label>
        <div class="actions">
          <button type="submit" id="btn-submit">Agregar</button>
          <button type="button" id="btn-cancel" class="ghost" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Productos en Supabase</h2>
      <ul id="project-list" class="list"></ul>
    </section>
  </main>

  <!-- Order matters: each file uses what the previous one created -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <!-- 1° library -->
  <script src="js/supabaseClient.js"></script>  <!-- 2° -->
  <script src="js/datos.js"></script>           <!-- 3° -->
  <script src="js/gestion.js"></script>         <!-- 4° -->
</body>
</html>
